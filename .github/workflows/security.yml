name: Security Scan

on:
  push:
  pull_request:

jobs:
  bandit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r . -f txt
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
         scan-type: fs
         scan-ref: .
         severity: CRITICAL,HIGH
         exit-code: 1
      
